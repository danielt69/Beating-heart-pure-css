<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beating Heart &mdash; Pure CSS</title>
    <meta name="description" content="A heart that beats, built with nothing but HTML and CSS. No images, no JavaScript.">
    <meta name="author" content="Daniel Tsionit">
    <meta property="og:title" content="Beating Heart — Pure CSS">
    <meta property="og:description" content="A heart that beats, built with nothing but HTML and CSS.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --heart: #e0123c;
            --heart-glow: rgba(224, 18, 60, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f5f5f7;
            background: radial-gradient(circle at 50% 35%, #2a0a14 0%, #120308 55%, #050103 100%);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p.tagline {
            margin-top: 0.6rem;
            color: #b9a0a7;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
        }

        .stage {
            margin: 3rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 22px var(--heart-glow));
        }

        .heart::before,
        .heart::after {
            position: absolute;
            content: "";
            top: 0;
            width: 50px;
            height: 80px;
            background: var(--heart);
            border-radius: 50px 50px 0 0;
        }

        .heart::before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.25); }
            28% { transform: scale(1); }
            42% { transform: scale(1.18); }
            70% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart { animation: none; }
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: #f5f5f7;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .repo-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }

        footer {
            position: absolute;
            bottom: 1.5rem;
            color: #6b5258;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <h1>Beating Heart</h1>
    <p class="tagline">Pure CSS &mdash; no images, no JavaScript.</p>

    <div class="stage" aria-label="An animated beating heart">
        <div class="heart" role="img"></div>
    </div>

</html>
