<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beating Heart &mdash; Pure CSS</title>
    <meta name="description" content="A heart that beats with a realistic lub-dub rhythm, built with nothing but HTML and CSS. No images, no JavaScript.">
    <meta name="author" content="Daniel Tsionit">
    <meta property="og:title" content="Beating Heart — Pure CSS">
    <meta property="og:description" content="A heart that beats with a realistic lub-dub rhythm, built with nothing but HTML and CSS.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --heart-top: #ff3a5e;
            --heart-bottom: #c20828;
            --heart-glow: rgba(255, 58, 94, 0.6);
            --beat: 1.3s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f5f5f7;
            background: #060106;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* ambient, slowly breathing background glow */
        body::before {
            content: "";
            position: fixed;
            inset: -25%;
            background: radial-gradient(circle at 50% 42%, #38071a 0%, #16030c 45%, #060106 75%);
            animation: ambient var(--beat) ease-in-out infinite;
            z-index: -2;
        }

        @keyframes ambient {
            0%, 36%, 100% { transform: scale(1); opacity: 0.9; }
            8% { transform: scale(1.04); opacity: 1; }
            22% { transform: scale(1.025); opacity: 0.97; }
        }

        h1 {
            font-size: clamp(1.7rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, #fff 0%, #ffb3c1 130%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.tagline {
            margin-top: 0.7rem;
            color: #c39aa5;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
        }

        .stage {
            margin: 3.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            position: relative;
        }

        /* expanding pulse ring emitted on each lub */
        .stage::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--heart-glow);
            opacity: 0;
            animation: ring var(--beat) ease-out infinite;
        }

        @keyframes ring {
            0% { transform: scale(0.5); opacity: 0.55; }
            30% { opacity: 0.2; }
            55%, 100% { transform: scale(2.1); opacity: 0; }
        }

        .heart {
            position: relative;
            width: 110px;
            height: 100px;
            animation: heartbeat var(--beat) infinite;
            filter: drop-shadow(0 0 26px var(--heart-glow));
            will-change: transform;
        }

        .heart::before,
        .heart::after {
            position: absolute;
            content: "";
            top: 0;
            width: 55px;
            height: 88px;
            background: linear-gradient(160deg, var(--heart-top) 0%, var(--heart-bottom) 85%);
            border-radius: 55px 55px 0 0;
        }

        .heart::before {
            left: 55px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* realistic lub-dub: sharp first contraction, lighter second, then a long diastole rest */
        @keyframes heartbeat {
            0%   { transform: scale(1); }
            8%   { transform: scale(1.32); animation-timing-function: ease-in; }
            16%  { transform: scale(1.02); }
            24%  { transform: scale(1.2); animation-timing-function: ease-in; }
            34%  { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart, .stage::after, body::before { animation: none; }
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: #f5f5f7;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .repo-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        footer {
            position: absolute;
            bottom: 1.5rem;
            color: #6b5258;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <h1>Beating Heart</h1>
    <p class="tagline">Pure CSS &mdash; no images, no JavaScript.</p>

    <div class="stage" aria-label="An animated beating heart">
        <div class="heart" role="img"></div>
    </div>
